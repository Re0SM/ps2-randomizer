name: Update PS2 Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GameDB-PS2
        run: |
          curl -L \
            "https://raw.githubusercontent.com/niemasd/GameDB-PS2/master/PS2.data.json" \
            -o PS2.data.json

      - name: Show downloaded file
        run: |
          ls -lh PS2.data.json
          head -c 500 PS2.data.json

            - name: Inspect database
        run: |
          echo "===== PRIMEIRAS 30 LINHAS ====="
          head -n 30 PS2.data.json

          echo ""
          echo "===== TAMANHO ====="
          wc -c PS2.data.json

          echo ""
          echo "===== TIPO ====="
          file PS2.data.json
