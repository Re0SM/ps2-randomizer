name: Update PS2 Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GameDB-PS2
        run: |
          curl -L \
            "https://raw.githubusercontent.com/niemasd/GameDB-PS2/master/PS2.data.json" \
            -o PS2.data.json

      - name: Show downloaded file
        run: |
          ls -lh PS2.data.json
          head -c 500 PS2.data.json

      - name: Process database
        run: |
          python3 - <<'PY'
          import json

          with open("PS2.data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Tipo da base:", type(data).__name__)

          if isinstance(data, dict):
              print("Chaves principais:")
              for key in list(data.keys())[:20]:
                  print(" -", key)

          elif isinstance(data, list):
              print("Quantidade de entradas:", len(data))

          PY
