name: Update PS2 Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GameDB-PS2
        run: |
          curl -L \
            "https://github.com/niemasd/GameDB-PS2/releases/latest/download/PS2.data.json" \
            -o PS2.data.json

      - name: Generate games.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import unicodedata

          with open("PS2.data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              entries = list(data.values())
          elif isinstance(data, list):
              entries = data
          else:
              raise ValueError("Formato inesperado da base")

          remove_patterns = [
              r"\bdemo\b",
              r"\bdemo disc\b",
              r"\bpromotional\b",
              r"\bpromo\b",
              r"\bsample disc\b",
              r"\btrial\b",
              r"\butility\b",
              r"\bsystem\b",
              r"\baction replay\b",
              r"\bgameshark\b",
              r"\bdvd\b",
              r"\bbrowser\b",
              r"\binstallation disc\b"
          ]

          edition_patterns = [
              r"\bplaystation 2 the best\b",
              r"\bps2 the best\b",
              r"\bgreatest hits\b",
              r"\bplatinum\b",
              r"\bclassics\b"
          ]

          games = []
          review = []
          groups = {}

          def get_value(game, *names):
              for name in names:
                  value = game.get(name)
                  if value is not None and value != "":
                      return value
              return None

          def normalize_title(title):
              value = title.strip()

              value = re.sub(
                  r"\s*[\(\[]\s*(disc|disk|cd|dvd)\s*[0-9ivx]+\s*[\)\]]",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              value = re.sub(
                  r"\s*[-:]\s*(disc|disk|cd|dvd)\s*[0-9ivx]+\s*$",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              for pattern in edition_patterns:
                  value = re.sub(
                      r"\s*[\(\[]?\s*" + pattern + r"\s*[\)\]]?\s*$",
                      "",
                      value,
                      flags=re.IGNORECASE
                  )

              value = unicodedata.normalize("NFKD", value)
              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )

              value = value.lower()
              value = re.sub(r"[^a-z0-9]+", " ", value)
              value = re.sub(r"\s+", " ", value).strip()

              return value

          def should_remove(title):
              normalized = title.lower()

              for pattern in remove_patterns:
                  if re.search(pattern, normalized):
                      return True

              return False

          for game in entries:
              if not isinstance(game, dict):
                  continue

              title = get_value(
                  game,
                  "title",
                  "name",
                  "Title",
                  "Name"
              )

              serial = get_value(
                  game,
                  "serial",
                  "Serial"
              )

              if not title:
                  continue

              record = {
                  "title": title,
                  "year": get_value(
                      game,
                      "year",
                      "release_year",
                      "releaseYear"
                  ),
                  "developer": get_value(
                      game,
                      "developer",
                      "Developer"
                  ),
                  "publisher": get_value(
                      game,
                      "publisher",
                      "Publisher"
                  ),
                  "genre": get_value(
                      game,
                      "genre",
                      "genres",
                      "Genre"
                  ),
                  "serial": serial
              }

              if should_remove(title):
                  review.append(record)
                  continue

              group_key = normalize_title(title)

              if not group_key:
                  continue

              if group_key not in groups:
                  groups[group_key] = []

              groups[group_key].append(record)

          # Ordem de preferência para escolher a capa.
          # Priorizamos versões ocidentais antes das japonesas.
          region_priority = [
              "SLUS",
              "SLES",
              "SCUS",
              "SCES",
              "SLKA",
              "SCAJ",
              "SLPM",
              "SLPS"
          ]

          def serial_priority(serial):
              if not serial:
                  return 999

              serial_upper = serial.upper()

              for index, prefix in enumerate(region_priority):
                  if serial_upper.startswith(prefix):
                      return index

              return 100

          def cover_url(serial):
              if not serial:
                  return None

              return (
                  "https://raw.githubusercontent.com/xlenore/"
                  "ps2-covers/main/covers/default/"
                  + serial
                  + ".jpg"
              )

          # Escolhe uma única entrada representativa de cada grupo.
          for group_key, variants in groups.items():

              variants.sort(
                  key=lambda game: (
                      serial_priority(game.get("serial")),
                      -sum(
                          value is not None and value != ""
                          for value in [
                              game.get("year"),
                              game.get("developer"),
                              game.get("publisher"),
                              game.get("genre"),
                              game.get("serial")
                          ]
                      ),
                      len(game.get("title", ""))
                  )
              )

              representative = dict(variants[0])

              # Guarda todos os seriais encontrados.
              serials = []
              titles = []

              for variant in variants:
                  if variant.get("serial"):
                      serials.append(variant["serial"])

                  if variant.get("title"):
                      titles.append(variant["title"])

              representative["serials"] = sorted(set(serials))
              representative["titles"] = sorted(set(titles))

              # Escolhe o melhor serial especificamente para a capa.
              cover_serial = None

              for variant in variants:
                  serial = variant.get("serial")

                  if not serial:
                      continue

                  if cover_serial is None:
                      cover_serial = serial
                      continue

                  if serial_priority(serial) < serial_priority(cover_serial):
                      cover_serial = serial

              if cover_serial:
                  representative["cover"] = cover_url(cover_serial)

              if len(representative["serials"]) <= 1:
                  representative.pop("serials", None)

              if len(representative["titles"]) <= 1:
                  representative.pop("titles", None)

              games.append(representative)

          games.sort(
              key=lambda game: game["title"].lower()
          )

          os.makedirs("data", exist_ok=True)

          with open(
              "data/games.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  games,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "data/games-review.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  review,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          duplicate_groups = []

          for group_key, variants in groups.items():
              if len(variants) > 1:
                  duplicate_groups.append({
                      "normalized_title": group_key,
                      "variants": variants
                  })

          duplicate_groups.sort(
              key=lambda item: item["normalized_title"]
          )

          with open(
              "data/games-groups-review.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  duplicate_groups,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print(f"Entradas originais: {len(entries)}")
          print(f"Entradas removidas: {len(review)}")
          print(f"Grupos com variantes: {len(duplicate_groups)}")
          print(f"Jogos no catálogo: {len(games)}")
          print("================================")

          # Testes rápidos de capas.
          print("")
          print("===== TESTE DE CAPAS =====")

          for game in games:
              if game["title"].lower() in [
                  "resident evil 4",
                  "final fantasy x",
                  "god of war",
                  "grand theft auto: san andreas",
                  "grand theft auto san andreas"
              ]:
                  print(
                      game["title"],
                      "->",
                      game.get("cover")
                  )
          PY

      - name: Save catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/games.json
          git add data/games-review.json
          git add data/games-groups-review.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no catálogo."
          else
            git commit -m "Update PS2 games catalog"
            git push
          fi
