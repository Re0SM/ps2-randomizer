name: Update PS2 Game Years

on:
  push:
    paths:
      - ".github/workflows/update-game-years.yml"
  workflow_run:
    workflows:
      - Update PS2 Games
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-years:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PlayStation DataCenter dump
        run: |
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 \
            "https://raw.githubusercontent.com/niemasd/GameDB-PS2/main/helper/psxdatacenter_dump/psxdatacenter_dump.zip" \
            -o psxdatacenter_dump.zip

      - name: Correlate years by serial
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          from datetime import datetime
          from html.parser import HTMLParser
          from zipfile import ZipFile

          GAMES_FILE = "data/games.json"
          ZIP_FILE = "psxdatacenter_dump.zip"

          with open(GAMES_FILE, "r", encoding="utf-8") as f:
              games = json.load(f)

          if not isinstance(games, list):
              raise ValueError("data/games.json não contém uma lista")

          def normalize_serial(value):
              return re.sub(r"[^A-Z0-9]", "", str(value or "").upper())

          def parse_year(value):
              value = html.unescape(str(value or "")).strip()
              if not value or value.lower() == "none":
                  return None

              for fmt in ("%d %B %Y", "%d %b %Y"):
                  try:
                      return str(datetime.strptime(value, fmt).year)
                  except ValueError:
                      pass

              match = re.search(r"\b(19[89][0-9]|20[0-2][0-9])\b", value)
              return match.group(1) if match else None

          class TableParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows = []
                  self.row = None
                  self.cell = None

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag == "tr":
                      if self.row is not None:
                          self.finish_row()
                      self.row = []
                  elif tag == "td" and self.row is not None:
                      self.cell = []

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "td" and self.cell is not None:
                      self.row.append(" ".join("".join(self.cell).split()))
                      self.cell = None
                  elif tag == "tr" and self.row is not None:
                      self.finish_row()

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def finish_row(self):
                  if self.cell is not None:
                      self.row.append(" ".join("".join(self.cell).split()))
                      self.cell = None
                  if self.row:
                      self.rows.append(self.row)
                  self.row = None

          def extract_years(raw):
              parser = TableParser()
              parser.feed(raw)
              parser.close()
              if parser.row is not None:
                  parser.finish_row()

              serials = []
              year = None

              for row in parser.rows:
                  if not row:
                      continue
                  label = row[0].strip().upper()
                  if label == "SERIAL NUMBER(S)":
                      serials.extend(normalize_serial(x) for x in row[1:] if normalize_serial(x))
                  elif label == "DATE RELEASED" and len(row) > 1:
                      year = parse_year(row[1])

              if not year or not serials:
                  return {}

              return {serial: year for serial in serials}

          needed = set()
          for game in games:
              for key in ("serial", "serials"):
                  value = game.get(key)
                  values = value if isinstance(value, list) else [value]
                  for item in values:
                      serial = normalize_serial(item)
                      if serial:
                          needed.add(serial)

          print(f"Jogos no catálogo: {len(games)}")
          print(f"Seriais a procurar: {len(needed)}")

          serial_years = {}

          with ZipFile(ZIP_FILE, "r") as archive:
              html_files = [n for n in archive.namelist() if n.lower().endswith(".html")]
              print(f"Arquivos HTML na base: {len(html_files)}")

              for index, name in enumerate(html_files, 1):
                  try:
                      raw = archive.read(name).decode("utf-8", errors="replace")
                      found = extract_years(raw)
                  except Exception:
                      continue

                  for serial, year in found.items():
                      if serial in needed and serial not in serial_years:
                          serial_years[serial] = year

                  if index % 1000 == 0:
                      print(f"Processados: {index}/{len(html_files)} · encontrados: {len(serial_years)}")

          updated = 0
          unresolved = 0

          for game in games:
              if game.get("year") not in (None, ""):
                  continue

              candidates = []
              for key in ("serial", "serials"):
                  value = game.get(key)
                  candidates.extend(value if isinstance(value, list) else [value])

              year = None
              for candidate in candidates:
                  serial = normalize_serial(candidate)
                  if serial in serial_years:
                      year = serial_years[serial]
                      break

              if year:
                  game["year"] = year
                  updated += 1
              else:
                  unresolved += 1

          with open(GAMES_FILE, "w", encoding="utf-8") as f:
              json.dump(games, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("================================")
          print(f"Anos preenchidos: {updated}")
          print(f"Sem ano encontrado: {unresolved}")
          print(f"Seriais com ano na base: {len(serial_years)}")
          print("================================")
          PY

      - name: Remove temporary dump
        run: rm -f psxdatacenter_dump.zip

      - name: Save games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos anos."
          else
            git commit -m "Fill PS2 game years from serials"
            git push
          fi
