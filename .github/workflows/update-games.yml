name: Update PS2 Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GameDB-PS2
        run: |
          curl -L \
            "https://github.com/niemasd/GameDB-PS2/releases/latest/download/PS2.data.json" \
            -o PS2.data.json

      - name: Generate games.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import unicodedata

          with open("PS2.data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              entries = list(data.values())
          elif isinstance(data, list):
              entries = data
          else:
              raise ValueError("Formato inesperado da base")

          remove_patterns = [
              r"\bdemo\b",
              r"\bdemo disc\b",
              r"\bpromotional\b",
              r"\bpromo\b",
              r"\bsample disc\b",
              r"\btrial\b",
              r"\butility\b",
              r"\bsystem\b",
              r"\baction replay\b",
              r"\bgameshark\b",
              r"\bdvd\b",
              r"\bbrowser\b",
              r"\binstallation disc\b"
          ]

          edition_patterns = [
              r"\bplaystation 2 the best\b",
              r"\bps2 the best\b",
              r"\bgreatest hits\b",
              r"\bplatinum\b",
              r"\bclassics\b"
          ]

          games = []
          review = []
          groups = {}

          def get_value(game, *names):
              for name in names:
                  value = game.get(name)
                  if value is not None and value != "":
                      return value
              return None

          # ============================================================
          # NORMALIZAÇÃO DE GÊNEROS
          # ============================================================

          def normalize_genre_value(value):
              if value is None:
                  return []

              if isinstance(value, str):
                  values = [value]
              elif isinstance(value, list):
                  values = value
              else:
                  return []

              result = []

              for genre in values:
                  if genre is None:
                      continue

                  genre = str(genre).strip()

                  if not genre:
                      continue

                  # Remove pontuação final.
                  genre = re.sub(r"\s*\.+\s*$", "", genre)

                  # Normaliza espaços.
                  genre = re.sub(r"\s+", " ", genre).strip()

                  # Remove acentos para comparação.
                  compare = unicodedata.normalize(
                      "NFKD",
                      genre
                  )

                  compare = "".join(
                      c for c in compare
                      if not unicodedata.combining(c)
                  )

                  compare = compare.lower().strip()

                  # Remove variações simples de pontuação.
                  compare = compare.replace("’", "'")
                  compare = re.sub(r"\s*-\s*", "-", compare)
                  compare = re.sub(r"\s*/\s*", "/", compare)

                  # ----------------------------------------------------
                  # SINÔNIMOS / VARIAÇÕES CONHECIDAS
                  # ----------------------------------------------------

                  genre_map = {

                      # Ação
                      "action": "Action",

                      # RPG
                      "rpg": "RPG",
                      "action rpg": "Action RPG",
                      "tactical rpg": "Tactical RPG",

                      # Aventura
                      "adventure": "Adventure",
                      "aventura": "Adventure",

                      "action-adventure": "Action-Adventure",
                      "action adventure": "Action-Adventure",
                      "action/ adventure": "Action-Adventure",
                      "action/adventure": "Action-Adventure",

                      # Luta
                      "fighting": "Fighting",

                      "beat'em up": "Beat 'Em Up",
                      "beat'em up": "Beat 'Em Up",
                      "beat 'em up": "Beat 'Em Up",
                      "beat em up": "Beat 'Em Up",
                      "beat'em-up": "Beat 'Em Up",

                      # Tiro
                      "first person shooter": "First-Person Shooter",
                      "first-person shooter": "First-Person Shooter",
                      "first person shooter": "First-Person Shooter",

                      "third-person shooter": "Third-Person Shooter",
                      "third person shooter": "Third-Person Shooter",

                      "shoot 'em up": "Shoot 'Em Up",
                      "shoot'em up": "Shoot 'Em Up",
                      "shoot em up": "Shoot 'Em Up",

                      "shooter": "Shooter",

                      # Plataforma
                      "platformer": "Platformer",
                      "plataformer": "Platformer",

                      # Esportes
                      "sports": "Sports",

                      "soccer": "Soccer",
                      "football": "Soccer",
                      "futebol": "Soccer",

                      "soccer manager": "Soccer Manager",
                      "soccer management": "Soccer Manager",

                      "basketball": "Basketball",
                      "baseball": "Baseball",
                      "beach volleyball": "Beach Volleyball",

                      "boxing": "Boxing",
                      "golf": "Golf",
                      "tennis": "Tennis",

                      "rugby": "Rugby",

                      "wrestling": "Wrestling",

                      "horse racing": "Horse Racing",

                      "ski": "Skiing",
                      "skiing": "Skiing",

                      "snowboard": "Snowboarding",
                      "snowboarding": "Snowboarding",

                      "skateboard": "Skateboarding",
                      "skateboarding": "Skateboarding",

                      "surfing": "Surfing",

                      "cycling": "Cycling",

                      # Corrida
                      "racing": "Racing",

                      # Música
                      "rhythm": "Rhythm",
                      "music": "Music",

                      # Simulação
                      "simulation": "Simulation",
                      "flight simulator": "Flight Simulator",
                      "dating simulation": "Dating Simulation",

                      # Estratégia
                      "strategy": "Strategy",

                      # Puzzle
                      "puzzle": "Puzzle",
                      "jigsaw puzzle": "Jigsaw Puzzle",

                      # Cartas / tabuleiro
                      "card": "Card",
                      "card battle": "Card Battle",
                      "board": "Board",
                      "chess": "Chess",
                      "mahjong": "Mahjong",
                      "shogi": "Shogi",
                      "igo": "Igo",
                      "hanafuda": "Hanafuda",
                      "poker": "Poker",

                      # Cassino
                      "casino": "Casino",
                      "gambling": "Gambling",

                      # Festa
                      "party": "Party",
                      "mini games": "Mini Games",
                      "mini-games": "Mini Games",
                      "mini games": "Mini Games",

                      # Visual Novel
                      "visual novel": "Visual Novel",

                      # Horror
                      "survival horror": "Survival Horror",

                      # MMORPG
                      "mmorpg": "MMORPG",

                      # Educacional
                      "educational": "Educational",
                      "edutainment": "Edutainment",

                      # Outros
                      "other": "Other",

                      # Quiz / Trivia
                      "quiz": "Quiz",
                      "trivia": "Trivia",

                      # Pinball
                      "pinball": "Pinball",

                      # Fishing
                      "fishing": "Fishing",

                      # Hunting
                      "hunting": "Hunting",

                      # Light Gun
                      "light gun shooter": "Light Gun Shooter",

                      # Gun
                      "gun": "Gun",

                      # Interactive Movie
                      "interactive movie": "Interactive Movie",

                      # Dating
                      "dating": "Dating",

                      # Breeding
                      "breeding": "Breeding",

                      # Building
                      "building": "Building",
                      "constructing": "Constructing",

                      # Exercise
                      "exercise": "Exercise",

                      # Dancing
                      "dancing": "Dancing",

                      # Data / Pictures
                      "data": "Data",
                      "pictures": "Pictures",

                      # Typing
                      "typing": "Typing",

                      # Sing
                      "sing": "Sing",

                      # Breakout
                      "breakout": "Breakout",

                      # Classic
                      "classic": "Classic",

                  }

                  canonical = genre_map.get(
                      compare,
                      None
                  )

                  if canonical:
                      result.append(canonical)
                  else:
                      # Para gêneros desconhecidos, mantém o texto
                      # original com capitalização limpa.
                      cleaned = genre.strip()

                      if cleaned:
                          cleaned = cleaned[0].upper() + cleaned[1:]
                          result.append(cleaned)

              # Remove duplicados preservando ordem.
              unique = []

              for item in result:
                  if item not in unique:
                      unique.append(item)

              return unique

          def normalize_genres(value):
              genres = normalize_genre_value(value)

              if not genres:
                  return None

              return genres

          # ============================================================
          # TÍTULOS
          # ============================================================

          def normalize_title(title):
              value = title.strip()

              value = re.sub(
                  r"\s*[\(\[]\s*(disc|disk|cd|dvd)\s*[0-9ivx]+\s*[\)\]]",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              value = re.sub(
                  r"\s*[-:]\s*(disc|disk|cd|dvd)\s*[0-9ivx]+\s*$",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              for pattern in edition_patterns:
                  value = re.sub(
                      r"\s*[\(\[]?\s*" + pattern + r"\s*[\)\]]?\s*$",
                      "",
                      value,
                      flags=re.IGNORECASE
                  )

              value = unicodedata.normalize(
                  "NFKD",
                  value
              )

              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )

              value = value.lower()

              value = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()

              return value

          def should_remove(title):
              normalized = title.lower()

              for pattern in remove_patterns:
                  if re.search(
                      pattern,
                      normalized
                  ):
                      return True

              return False

          # ============================================================
          # PROCESSAMENTO
          # ============================================================

          for game in entries:

              if not isinstance(game, dict):
                  continue

              title = get_value(
                  game,
                  "title",
                  "name",
                  "Title",
                  "Name"
              )

              serial = get_value(
                  game,
                  "serial",
                  "Serial"
              )

              if not title:
                  continue

              genres = normalize_genres(
                  get_value(
                      game,
                      "genre",
                      "genres",
                      "Genre"
                  )
              )

              record = {
                  "title": title,

                  "year": get_value(
                      game,
                      "year",
                      "release_year",
                      "releaseYear"
                  ),

                  "developer": get_value(
                      game,
                      "developer",
                      "Developer"
                  ),

                  "publisher": get_value(
                      game,
                      "publisher",
                      "Publisher"
                  ),

                  "genre": genres,

                  "serial": serial
              }

              if should_remove(title):
                  review.append(record)
                  continue

              group_key = normalize_title(title)

              if not group_key:
                  continue

              if group_key not in groups:
                  groups[group_key] = []

              groups[group_key].append(record)

          # ============================================================
          # REGIÕES
          # ============================================================

          region_priority = [
              "SLUS",
              "SLES",
              "SCUS",
              "SCES",
              "SLKA",
              "SCAJ",
              "SLPM",
              "SLPS"
          ]

          def serial_priority(serial):

              if not serial:
                  return 999

              serial_upper = serial.upper()

              for index, prefix in enumerate(
                  region_priority
              ):

                  if serial_upper.startswith(
                      prefix
                  ):
                      return index

              return 100

          def choose_cover_serial(variants):

              best = None

              for variant in variants:

                  serial = variant.get(
                      "serial"
                  )

                  if not serial:
                      continue

                  if best is None:
                      best = serial
                      continue

                  if (
                      serial_priority(serial)
                      <
                      serial_priority(best)
                  ):

                      best = serial

              return best

          # ============================================================
          # ESCOLHA DA ENTRADA REPRESENTATIVA
          # ============================================================

          for group_key, variants in groups.items():

              variants.sort(
                  key=lambda game: (
                      serial_priority(
                          game.get("serial")
                      ),

                      -sum(
                          value is not None
                          and value != ""
                          for value in [
                              game.get("year"),
                              game.get("developer"),
                              game.get("publisher"),
                              game.get("genre"),
                              game.get("serial")
                          ]
                      ),

                      len(
                          game.get(
                              "title",
                              ""
                          )
                      )
                  )
              )

              representative = dict(
                  variants[0]
              )

              serials = []
              titles = []

              for variant in variants:

                  if variant.get("serial"):
                      serials.append(
                          variant["serial"]
                      )

                  if variant.get("title"):
                      titles.append(
                          variant["title"]
                      )

              representative["serials"] = sorted(
                  set(serials)
              )

              representative["titles"] = sorted(
                  set(titles)
              )

              # ========================================================
              # CONSOLIDA GÊNEROS DE TODAS AS VARIANTES
              # ========================================================

              all_genres = []

              for variant in variants:

                  variant_genres = (
                      variant.get("genre")
                      or []
                  )

                  if isinstance(
                      variant_genres,
                      str
                  ):
                      variant_genres = [
                          variant_genres
                      ]

                  for genre in variant_genres:

                      if genre not in all_genres:
                          all_genres.append(
                              genre
                          )

              if all_genres:
                  representative["genre"] = sorted(
                      all_genres,
                      key=lambda x: x.lower()
                  )
              else:
                  representative["genre"] = None

              # ========================================================
              # SERIAL DA CAPA
              # ========================================================

              cover_serial = choose_cover_serial(
                  variants
              )

              if cover_serial:
                  representative[
                      "cover_serial"
                  ] = cover_serial

              if len(
                  representative["serials"]
              ) <= 1:

                  representative.pop(
                      "serials",
                      None
                  )

              if len(
                  representative["titles"]
              ) <= 1:

                  representative.pop(
                      "titles",
                      None
                  )

              games.append(
                  representative
              )

          # ============================================================
          # ORDENAÇÃO
          # ============================================================

          games.sort(
              key=lambda game:
                  game["title"].lower()
          )

          # ============================================================
          # DIRETÓRIOS
          # ============================================================

          os.makedirs(
              "data",
              exist_ok=True
          )

          os.makedirs(
              "data/covers",
              exist_ok=True
          )

          # ============================================================
          # CAMINHOS LOCAIS DAS CAPAS
          # ============================================================

          for game in games:

              serial = game.get(
                  "cover_serial"
              )

              if serial:

                  game["cover"] = (
                      f"data/covers/{serial}.jpg"
                  )

              else:

                  game["cover"] = None

              game.pop(
                  "cover_serial",
                  None
              )

          # ============================================================
          # GAMES.JSON
          # ============================================================

          with open(
              "data/games.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  games,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # REVIEW
          # ============================================================

          with open(
              "data/games-review.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  review,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # GRUPOS
          # ============================================================

          duplicate_groups = []

          for group_key, variants in groups.items():

              if len(variants) > 1:

                  duplicate_groups.append({
                      "normalized_title":
                          group_key,

                      "variants":
                          variants
                  })

          duplicate_groups.sort(
              key=lambda item:
                  item["normalized_title"]
          )

          with open(
              "data/games-groups-review.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  duplicate_groups,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # ESTATÍSTICAS
          # ============================================================

          games_with_year = sum(
              1
              for game in games
              if game.get("year")
          )

          games_without_year = (
              len(games)
              -
              games_with_year
          )

          genre_counts = {}

          for game in games:

              genres = (
                  game.get("genre")
                  or []
              )

              if isinstance(
                  genres,
                  str
              ):
                  genres = [genres]

              for genre in genres:

                  genre_counts[genre] = (
                      genre_counts.get(
                          genre,
                          0
                      ) + 1
                  )

          print("================================")
          print(
              f"Entradas originais: {len(entries)}"
          )
          print(
              f"Entradas removidas: {len(review)}"
          )
          print(
              f"Grupos com variantes: "
              f"{len(duplicate_groups)}"
          )
          print(
              f"Jogos no catálogo: {len(games)}"
          )
          print(
              f"Jogos com ano: {games_with_year}"
          )
          print(
              f"Jogos sem ano: {games_without_year}"
          )
          print("================================")

          print("")
          print("===== GÊNEROS NORMALIZADOS =====")

          for genre in sorted(
              genre_counts,
              key=lambda x: x.lower()
          ):

              print(
                  f"{genre}: "
                  f"{genre_counts[genre]}"
              )

          print("================================")

          PY

      - name: Download game covers
        run: |
          mkdir -p data/covers

          echo "Baixando capas que ainda não existem..."

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from concurrent.futures import ThreadPoolExecutor

          with open(
              "data/games.json",
              "r",
              encoding="utf-8"
          ) as f:

              games = json.load(f)

          BASE_URL = (
              "https://raw.githubusercontent.com/"
              "xlenore/ps2-covers/main/covers/default"
          )

          downloads = []

          for game in games:

              cover = game.get(
                  "cover"
              )

              if not cover:
                  continue

              filename = os.path.basename(
                  cover
              )

              output = os.path.join(
                  "data",
                  "covers",
                  filename
              )

              if (
                  os.path.isfile(output)
                  and
                  os.path.getsize(output) > 0
              ):
                  continue

              serial = os.path.splitext(
                  filename
              )[0]

              downloads.append(
                  (
                      serial,
                      f"{BASE_URL}/{serial}.jpg",
                      output
                  )
              )

          print(
              f"Capas já existentes: "
              f"{len(games) - len(downloads)}"
          )

          print(
              f"Capas novas para baixar: "
              f"{len(downloads)}"
          )

          def download(item):

              serial, url, output = item

              result = subprocess.run(
                  [
                      "curl",
                      "-L",
                      "--fail",
                      "--silent",
                      "--show-error",
                      "--retry",
                      "2",
                      "--connect-timeout",
                      "10",
                      "--max-time",
                      "30",
                      url,
                      "-o",
                      output
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True
              )

              if (
                  result.returncode == 0
                  and os.path.isfile(output)
              ):

                  if (
                      os.path.getsize(output)
                      > 0
                  ):

                      return True, serial

              if os.path.exists(output):
                  os.remove(output)

              return False, serial

          success = 0
          failed = 0

          with ThreadPoolExecutor(
              max_workers=12
          ) as executor:

              for ok, serial in executor.map(
                  download,
                  downloads
              ):

                  if ok:

                      success += 1

                  else:

                      failed += 1

                      print(
                          f"Não encontrada: "
                          f"{serial}"
                      )

          print("")
          print("================================")
          print(
              f"Capas baixadas: {success}"
          )
          print(
              f"Capas não encontradas: {failed}"
          )
          print("================================")

          PY

      - name: Verify generated catalog
        run: |
          echo "===== TESTE DE CAPAS ====="

          python3 - <<'PY'
          import json
          import os

          with open(
              "data/games.json",
              "r",
              encoding="utf-8"
          ) as f:

              games = json.load(f)

          tests = [
              "Resident Evil 4",
              "Final Fantasy X",
              "God of War",
              "Grand Theft Auto: San Andreas",
              "Grand Theft Auto San Andreas"
          ]

          test_names = [
              x.lower()
              for x in tests
          ]

          for game in games:

              if (
                  game["title"].lower()
                  in test_names
              ):

                  cover = game.get(
                      "cover"
                  )

                  exists = (
                      cover
                      and os.path.isfile(cover)
                      and os.path.getsize(cover) > 0
                  )

                  print(
                      f'{game["title"]} -> '
                      f'{cover} -> '
                      f'{"OK" if exists else "NÃO ENCONTRADA"}'
                  )

          PY

          echo ""
          echo "===== TESTE DE ANOS ====="

          python3 - <<'PY'
          import json

          with open(
              "data/games.json",
              "r",
              encoding="utf-8"
          ) as f:

              games = json.load(f)

          tests = [
              "Final Fantasy X",
              "God of War",
              "Grand Theft Auto: San Andreas",
              "Resident Evil 4"
          ]

          test_names = [
              x.lower()
              for x in tests
          ]

          for game in games:

              if (
                  game["title"].lower()
                  in test_names
              ):

                  print(
                      f'{game["title"]} -> '
                      f'ano: {game.get("year")}'
                  )

          PY

          echo ""
          echo "===== TESTE DE GÊNEROS ====="

          python3 - <<'PY'
          import json

          with open(
              "data/games.json",
              "r",
              encoding="utf-8"
          ) as f:

              games = json.load(f)

          genres = {}

          for game in games:

              values = (
                  game.get("genre")
                  or []
              )

              if isinstance(
                  values,
                  str
              ):
                  values = [values]

              for genre in values:

                  genres[genre] = (
                      genres.get(
                          genre,
                          0
                      ) + 1
                  )

          for genre in sorted(
              genres,
              key=lambda x: x.lower()
          ):

              print(
                  f"{genre}: "
                  f"{genres[genre]}"
              )

          PY

      - name: Save catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/games.json
          git add data/games-review.json
          git add data/games-groups-review.json
          git add data/covers/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no catálogo."
          else
            git commit -m "Update PS2 games catalog"
            git push
          fi
