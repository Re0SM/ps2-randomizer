              "breeding": "Simulação",
              "breeding.": "Simulação",

              "building": "Simulação",
              "building.": "Simulação",

              "constructing": "Simulação",
              "constructing.": "Simulação",

              # PUZZLE
              "puzzle": "Quebra-Cabeça",
              "puzzle.": "Quebra-Cabeça",

              "jigsaw puzzle": "Quebra-Cabeça",
              "jigsaw puzzle.": "Quebra-Cabeça",

              "breakout": "Quebra-Cabeça",
              "breakout.": "Quebra-Cabeça",

              # QUIZ
              "quiz": "Quiz",
              "quiz.": "Quiz",

              "trivia": "Quiz",
              "trivia.": "Quiz",

              # TABULEIRO
              "board": "Tabuleiro",
              "board.": "Tabuleiro",

              "chess": "Tabuleiro",
              "chess.": "Tabuleiro",

              "mahjong": "Tabuleiro",
              "mahjong.": "Tabuleiro",

              "shogi": "Tabuleiro",
              "shogi.": "Tabuleiro",

              "igo": "Tabuleiro",
              "igo.": "Tabuleiro",

              # PINBALL
              "pinball": "Pinball",
              "pinball.": "Pinball",

              # CASINO / APOSTAS
              "casino": "Variedades",
              "casino.": "Variedades",

              "gambling": "Variedades",
              "gambling.": "Variedades",

              "poker": "Cartas",
              "poker.": "Cartas",

              "hanafuda": "Cartas",
              "hanafuda.": "Cartas",

              # PESCA
              "fishing": "Pesca",
              "fishing.": "Pesca",

              # SKI / SNOW
              "ski": "Esportes",
              "ski.": "Esportes",
              "skiing": "Esportes",
              "skiing.": "Esportes",
              "snowboard": "Esportes",
              "snowboard.": "Esportes",
              "snowboarding": "Esportes",
              "snowboarding.": "Esportes",

              # SKATE
              "skateboard": "Esportes",
              "skateboard.": "Esportes",
              "skateboarding": "Esportes",
              "skateboarding.": "Esportes",

              # SURF
              "surfing": "Esportes",
              "surfing.": "Esportes",

              # CAÇA
              "hunting": "Esportes",
              "hunting.": "Esportes",

              # MMORPG
              "mmorpg": "MMORPG",
              "mmorpg.": "MMORPG",

              # VISUAL NOVEL
              "visual novel": "Visual Novel",
              "visual novel.": "Visual Novel",

              # PARTY / VARIEDADES
              "party": "Variedades",
              "party.": "Variedades",

              "mini games": "Variedades",
              "mini games.": "Variedades",
              "mini games ": "Variedades",
              "mini games..": "Variedades",

              "mini games": "Variedades",
              "mini games.": "Variedades",

              "mini-games": "Variedades",
              "mini-games.": "Variedades",

              "sing": "Ritmo",
              "sing.": "Ritmo",

              # OUTROS
              "other": "Variedades",
              "other.": "Variedades",

              "exercise": "Esportes",
              "exercise.": "Esportes",

              # NAVE
              "shoot 'em up": "Nave",
              "shoot 'em up.": "Nave",

              # ROGUELIKE
              "roguelike": "Roguelike",
              "roguelike.": "Roguelike"
          }

          official_genres = [
              "Ação",
              "Ação em terceira pessoa",
              "Adventure",
              "Animação Interativa",
              "Aventura",
              "Baseball",
              "Basquete",
              "Boxe",
              "Briga de Rua",
              "Cartas",
              "Coletânea",
              "Corrida",
              "Digitação",
              "Educação",
              "Esportes",
              "Estratégia",
              "Futebol",
              "Futebol Americano",
              "Gerente de Esportes",
              "Golfe",
              "Hóquei",
              "Luta",
              "Luta Livre",
              "MMORPG",
              "Nave",
              "Pesca",
              "Pinball",
              "Pistola",
              "Plataforma",
              "Quebra-Cabeça",
              "Quiz",
              "Ritmo",
              "Roguelike",
              "RPG",
              "Simulação",
              "Tabuleiro",
              "Tênis",
              "Terror de Sobrevivência",
              "Tiro",
              "Tiro em Primeira Pessoa",
              "Variedades",
              "Visual Novel",
              "Vôlei"
          ]

          def normalize_genre(value):

              if value is None:
                  return None

              value = str(value).strip()

              value = re.sub(r"\s+", " ", value)

              # Remove pontuação final usada pela base.
              value_without_period = re.sub(
                  r"\.+$",
                  "",
                  value
              ).strip()

              key = value_without_period.lower()

              if key in genre_map:
                  return genre_map[key]

              # Tenta a versão exatamente como veio.
              if value.lower() in genre_map:
                  return genre_map[value.lower()]

              # Correções genéricas.
              normalized = unicodedata.normalize(
                  "NFKD",
                  key
              )

              normalized = "".join(
                  c for c in normalized
                  if not unicodedata.combining(c)
              )

              normalized = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  normalized
              )

              normalized = re.sub(
                  r"\s+",
                  " ",
                  normalized
              ).strip()

              generic_map = {
                  "action": "Ação",
                  "adventure": "Adventure",
                  "action rpg": "RPG",
                  "platformer": "Plataforma",
                  "plataformer": "Plataforma",
                  "rpg": "RPG",
                  "tactical rpg": "RPG",
                  "fighting": "Luta",
                  "racing": "Corrida",
                  "rhythm": "Ritmo",
                  "sports": "Esportes",
                  "strategy": "Estratégia",
                  "simulation": "Simulação",
                  "puzzle": "Quebra-Cabeça",
                  "shooter": "Tiro",
                  "survival horror": "Terror de Sobrevivência",
                  "visual novel": "Visual Novel",
                  "soccer": "Futebol",
                  "football": "Futebol",
                  "basketball": "Basquete",
                  "baseball": "Baseball",
                  "tennis": "Tênis",
                  "golf": "Golfe",
                  "boxing": "Boxe",
                  "wrestling": "Luta Livre",
                  "mmorpg": "MMORPG",
                  "party": "Variedades",
                  "quiz": "Quiz",
                  "trivia": "Quiz",
                  "pinball": "Pinball",
                  "fishing": "Pesca",
                  "typing": "Digitação",
                  "educational": "Educação",
                  "edutainment": "Educação",
                  "board": "Tabuleiro",
                  "chess": "Tabuleiro",
                  "mahjong": "Tabuleiro",
                  "shogi": "Tabuleiro",
                  "igo": "Tabuleiro",
                  "casino": "Variedades",
                  "gambling": "Variedades",
                  "poker": "Cartas",
                  "card": "Cartas",
                  "card battle": "Cartas",
                  "music": "Ritmo",
                  "dancing": "Ritmo",
                  "exercise": "Esportes",
                  "ski": "Esportes",
                  "skiing": "Esportes",
                  "snowboard": "Esportes",
                  "snowboarding": "Esportes",
                  "skateboard": "Esportes",
                  "skateboarding": "Esportes",
                  "surfing": "Esportes",
                  "hunting": "Esportes",
                  "shoot em up": "Nave",
                  "light gun shooter": "Pistola",
                  "gun": "Pistola",
                  "first person shooter": "Tiro em Primeira Pessoa",
                  "third person shooter": "Ação em terceira pessoa",
                  "interactive movie": "Animação Interativa",
                  "other": "Variedades",
                  "classic": "Coletânea",
                  "data": "Coletânea",
                  "pictures": "Coletânea",
                  "mini games": "Variedades",
                  "sing": "Ritmo",
                  "roguelike": "Roguelike"
              }

              if normalized in generic_map:
                  return generic_map[normalized]

              return value_without_period

          # ============================================================
          # LEITURA DOS JOGOS
          # ============================================================

          for game in entries:

              if not isinstance(game, dict):
                  continue

              title = get_value(
                  game,
                  "title",
                  "name",
                  "Title",
                  "Name"
              )

              serial = get_value(
                  game,
                  "serial",
                  "Serial"
              )

              if not title:
                  continue

              title = clean_text(title)
              serial = clean_text(serial)

              year = get_value(
                  game,
                  "year",
                  "release_year",
                  "releaseYear"
              )

              developer = clean_text(
                  get_value(
                      game,
                      "developer",
                      "Developer"
                  )
              )

              publisher = clean_text(
                  get_value(
                      game,
                      "publisher",
                      "Publisher"
                  )
              )

              genre_raw = get_value(
                  game,
                  "genre",
                  "genres",
                  "Genre"
              )

              # --------------------------------------------------------
              # Gênero
              # --------------------------------------------------------

              if isinstance(genre_raw, list):

                  normalized_genres = []

                  for genre in genre_raw:

                      normalized = normalize_genre(genre)

                      if normalized:
                          normalized_genres.append(normalized)

                  normalized_genres = sorted(
                      set(normalized_genres),
                      key=lambda x: x.lower()
                  )

                  genre = ", ".join(normalized_genres)

              else:
                  genre = normalize_genre(genre_raw)

              record = {
                  "title": title,
                  "year": year,
                  "developer": developer,
                  "publisher": publisher,
                  "genre": genre,
                  "serial": serial
              }

              if should_remove(title):
                  review.append(record)
                  continue

              group_key = normalize_title(title)

              if not group_key:
                  continue

              if group_key not in groups:
                  groups[group_key] = []

              groups[group_key].append(record)

          # ============================================================
          # REGIÕES
          # ============================================================

          region_priority = [
              "SLUS",
              "SLES",
              "SCUS",
              "SCES",
              "SLKA",
              "SCAJ",
              "SLPM",
              "SLPS"
          ]

          def serial_priority(serial):

              if not serial:
                  return 999

              serial_upper = serial.upper()

              for index, prefix in enumerate(region_priority):

                  if serial_upper.startswith(prefix):
                      return index

              return 100

          def choose_cover_serial(variants):

              best = None

              for variant in variants:

                  serial = variant.get("serial")

                  if not serial:
                      continue

                  if best is None:
                      best = serial
                      continue

                  if serial_priority(serial) < serial_priority(best):
                      best = serial

              return best

          # ============================================================
          # AGRUPAMENTO
          # ============================================================

          for group_key, variants in groups.items():

              variants.sort(
                  key=lambda game: (
                      serial_priority(
                          game.get("serial")
                      ),
                      -sum(
                          value is not None and value != ""
                          for value in [
                              game.get("year"),
                              game.get("developer"),
                              game.get("publisher"),
                              game.get("genre"),
                              game.get("serial")
                          ]
                      ),
                      len(
                          game.get("title", "")
                      )
                  )
              )

              representative = dict(
                  variants[0]
              )

              serials = []
              titles = []

              for variant in variants:

                  if variant.get("serial"):
                      serials.append(
                          variant["serial"]
                      )

                  if variant.get("title"):
                      titles.append(
                          variant["title"]
                      )

              representative["serials"] = sorted(
                  set(serials)
              )

              representative["titles"] = sorted(
                  set(titles)
              )

              cover_serial = choose_cover_serial(
                  variants
              )

              if cover_serial:
                  representative["cover_serial"] = cover_serial

              if len(
                  representative["serials"]
              ) <= 1:
                  representative.pop(
                      "serials",
                      None
                  )

              if len(
                  representative["titles"]
              ) <= 1:
                  representative.pop(
                      "titles",
                      None
                  )

              games.append(
                  representative
              )

          games.sort(
              key=lambda game:
                  game["title"].lower()
          )

          os.makedirs(
              "data",
              exist_ok=True
          )

          os.makedirs(
              "data/covers",
              exist_ok=True
          )

          for game in games:

              serial = game.get(
                  "cover_serial"
              )

              if serial:

                  game["cover"] = (
                      f"data/covers/{serial}.jpg"
                  )

              else:
                  game["cover"] = None

              game.pop(
                  "cover_serial",
                  None
              )

          # ============================================================
          # GAMES.JSON
          # ============================================================

          with open(
              "data/games.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  games,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # REVIEW
          # ============================================================

          with open(
              "data/games-review.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  review,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # GRUPOS
          # ============================================================

          duplicate_groups = []

          for group_key, variants in groups.items():

              if len(variants) > 1:

                  duplicate_groups.append({
                      "normalized_title": group_key,
                      "variants": variants
                  })

          duplicate_groups.sort(
              key=lambda item:
                  item["normalized_title"]
          )

          with open(
              "data/games-groups-review.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  duplicate_groups,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # ESTATÍSTICAS
          # ============================================================

          with_year = sum(
              1
              for game in games
              if game.get("year")
          )

          without_year = (
              len(games) - with_year
          )

          genre_counts = {}

          for game in games:

              genre = game.get("genre")

              if genre:

                  genre_counts[genre] = (
                      genre_counts.get(
                          genre,
                          0
                      ) + 1
                  )

          print("================================")
          print(
              f"Entradas originais: {len(entries)}"
          )
          print(
              f"Entradas removidas: {len(review)}"
          )
          print(
              f"Grupos com variantes: {len(duplicate_groups)}"
          )
          print(
              f"Jogos no catálogo: {len(games)}"
          )
          print(
              f"Jogos com ano: {with_year}"
          )
          print(
              f"Jogos sem ano: {without_year}"
          )
          print("================================")

          print("")
          print("===== GÊNEROS =====")

          for genre in sorted(
              genre_counts,
              key=lambda x: x.lower()
          ):

              print(
                  f"{genre}: {genre_counts[genre]}"
              )

          print("================================")
          PY

      - name: Download game covers
        run: |
          mkdir -p data/covers

          echo "Baixando capas que ainda não existem..."

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from concurrent.futures import ThreadPoolExecutor

          with open(
              "data/games.json",
              "r",
              encoding="utf-8"
          ) as f:

              games = json.load(f)

          BASE_URL = (
              "https://raw.githubusercontent.com/"
              "xlenore/ps2-covers/main/covers/default"
          )

          downloads = []

          existing = 0

          for game in games:

              cover = game.get("cover")

              if not cover:
                  continue

              filename = os.path.basename(
                  cover
              )

              output = os.path.join(
                  "data",
                  "covers",
                  filename
              )

              if (
                  os.path.isfile(output)
                  and os.path.getsize(output) > 0
              ):

                  existing += 1
                  continue

              serial = os.path.splitext(
                  filename
              )[0]

              downloads.append(
                  (
                      serial,
                      f"{BASE_URL}/{serial}.jpg",
                      output
                  )
              )

          print(
              f"Capas já existentes: {existing}"
          )

          print(
              f"Capas novas para baixar: {len(downloads)}"
          )

          def download(item):

              serial, url, output = item

              result = subprocess.run(
                  [
                      "curl",
                      "-L",
                      "--fail",
                      "--silent",
                      "--show-error",
                      "--retry",
                      "2",
                      "--connect-timeout",
                      "10",
                      "--max-time",
                      "30",
                      url,
                      "-o",
                      output
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True
              )

              if (
                  result.returncode == 0
                  and os.path.isfile(output)
                  and os.path.getsize(output) > 0
              ):

                  return True, serial

              if os.path.exists(output):
                  os.remove(output)

              return False, serial

          success = 0
          failed = 0

          with ThreadPoolExecutor(
              max_workers=12
          ) as executor:

              for ok, serial in executor.map(
                  download,
                  downloads
              ):

                  if ok:
                      success += 1

                  else:
                      failed += 1

                      print(
                          f"Não encontrada: {serial}"
                      )

          print("")
          print("================================")
          print(
              f"Capas baixadas: {success}"
          )
          print(
              f"Capas não encontradas: {failed}"
          )
          print("================================")
          PY

      - name: Verify generated catalog
        run: |
          echo "===== TESTE DO CATÁLOGO ====="

          python3 - <<'PY'
          import json
          import os

          with open(
              "data/games.json",
              "r",
              encoding="utf-8"
          ) as f:

              games = json.load(f)

          tests = [
              "Resident Evil 4",
              "Final Fantasy X",
              "God of War",
              "Grand Theft Auto: San Andreas",
              "Grand Theft Auto San Andreas"
          ]

          test_names = {
              x.lower()
              for x in tests
          }

          for game in games:

              if (
                  game["title"].lower()
                  in test_names
              ):

                  cover = game.get("cover")

                  exists = (
                      cover
                      and os.path.isfile(cover)
                      and os.path.getsize(cover) > 0
                  )

                  print(
                      f'{game["title"]} -> '
                      f'ano: {game.get("year")} -> '
                      f'gênero: {game.get("genre")} -> '
                      f'capa: '
                      f'{"OK" if exists else "NÃO ENCONTRADA"}'
                  )

          print("")
          print("===== TESTE DE GÊNEROS =====")

          problematic = [
              "Adventure.",
              "Soccer.",
              "Soccer",
              "Visual Novel.",
              "Visual Novel",
              "Beat'em Up.",
              "Beat'em up.",
              "Platformer",
              "Plataformer",
              "First Person Shooter.",
              "First-person Shooter.",
              "Tactical RPG.",
              "Survival Horror."
          ]

          found = {}

          for game in games:

              genre = game.get("genre")

              if genre in problematic:
                  found[genre] = found.get(
                      genre,
                      0
                  ) + 1

          for genre, count in sorted(
              found.items()
          ):

              print(
                  f'ERRO: "{genre}" -> {count}'
              )

          if not found:
              print(
                  "OK: nenhuma das variações problemáticas foi encontrada."
              )
          PY

