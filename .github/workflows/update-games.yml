name: Update PS2 Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GameDB-PS2
        run: |
          curl -L \
            "https://github.com/niemasd/GameDB-PS2/releases/latest/download/PS2.data.json" \
            -o PS2.data.json

      - name: Generate games.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import unicodedata

          with open("PS2.data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              entries = list(data.values())
          elif isinstance(data, list):
              entries = data
          else:
              raise ValueError("Formato inesperado da base")

          remove_patterns = [
              r"\bdemo\b",
              r"\bdemo disc\b",
              r"\bpromotional\b",
              r"\bpromo\b",
              r"\bsample disc\b",
              r"\btrial\b",
              r"\butility\b",
              r"\bsystem\b",
              r"\baction replay\b",
              r"\bgameshark\b",
              r"\bdvd\b",
              r"\bbrowser\b",
              r"\binstallation disc\b"
          ]

          edition_patterns = [
              r"\bplaystation 2 the best\b",
              r"\bps2 the best\b",
              r"\bgreatest hits\b",
              r"\bplatinum\b",
              r"\bclassics\b"
          ]

          games = []
          review = []
          groups = {}

          def get_value(game, *names):
              for name in names:
                  value = game.get(name)

                  if value is not None and value != "":
                      return value

              return None

          def normalize_title(title):
              value = title.strip()

              value = re.sub(
                  r"\s*[\(\[]\s*(disc|disk|cd|dvd)\s*[0-9ivx]+\s*[\)\]]",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              value = re.sub(
                  r"\s*[-:]\s*(disc|disk|cd|dvd)\s*[0-9ivx]+\s*$",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              for pattern in edition_patterns:
                  value = re.sub(
                      r"\s*[\(\[]?\s*" + pattern + r"\s*[\)\]]?\s*$",
                      "",
                      value,
                      flags=re.IGNORECASE
                  )

              value = unicodedata.normalize("NFKD", value)

              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )

              value = value.lower()

              value = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()

              return value

          def should_remove(title):
              normalized = title.lower()

              for pattern in remove_patterns:
                  if re.search(pattern, normalized):
                      return True

              return False

          def extract_year(value):
              """
              Tenta extrair um ano de vários formatos possíveis.

              Exemplos aceitos:
              2004
              "2004"
              "2004-09-22"
              "22/09/2004"
              "09/22/2004"
              "2004/09/22"
              """

              if value is None:
                  return None

              if isinstance(value, int):
                  if 1900 <= value <= 2100:
                      return value

                  return None

              if isinstance(value, float):
                  if value.is_integer():
                      value = int(value)

                      if 1900 <= value <= 2100:
                          return value

                  return None

              if isinstance(value, dict):

                  for key in [
                      "year",
                      "release_year",
                      "releaseYear",
                      "date",
                      "release_date",
                      "releaseDate"
                  ]:

                      if key in value:

                          result = extract_year(
                              value[key]
                          )

                          if result:
                              return result

                  return None

              text = str(value).strip()

              if not text:
                  return None

              match = re.search(
                  r"\b(19\d{2}|20\d{2})\b",
                  text
              )

              if match:
                  return int(
                      match.group(1)
                  )

              return None

          def find_year(game):
              """
              Procura a data/ano em todos os campos conhecidos
              do GameDB-PS2.
              """

              possible_fields = [

                  "year",
                  "release_year",
                  "releaseYear",

                  "release_date",
                  "releaseDate",

                  "date",
                  "release",

                  "released",
                  "ReleaseDate",
                  "release_date_us",
                  "release_date_eu",
                  "release_date_jp"

              ]

              for field in possible_fields:

                  if field not in game:
                      continue

                  year = extract_year(
                      game.get(field)
                  )

                  if year:
                      return year

              return None

          def find_first_value(
              variants,
              field_names,
              prefer_non_empty=True
          ):

              for variant in variants:

                  for field in field_names:

                      value = variant.get(field)

                      if (
                          value is not None
                          and value != ""
                      ):

                          return value

              return None

          for game in entries:

              if not isinstance(game, dict):
                  continue

              title = get_value(
                  game,
                  "title",
                  "name",
                  "Title",
                  "Name"
              )

              serial = get_value(
                  game,
                  "serial",
                  "Serial"
              )

              if not title:
                  continue

              record = {
                  "title": title,

                  "year": find_year(game),

                  "developer": get_value(
                      game,
                      "developer",
                      "Developer"
                  ),

                  "publisher": get_value(
                      game,
                      "publisher",
                      "Publisher"
                  ),

                  "genre": get_value(
                      game,
                      "genre",
                      "genres",
                      "Genre"
                  ),

                  "serial": serial
              }

              if should_remove(title):

                  review.append(record)

                  continue

              group_key = normalize_title(title)

              if not group_key:
                  continue

              if group_key not in groups:
                  groups[group_key] = []

              groups[group_key].append(record)

          # ============================================================
          # ORDEM DE PREFERÊNCIA DAS REGIÕES
          # ============================================================

          region_priority = [

              "SLUS",
              "SLES",
              "SCUS",
              "SCES",

              "SLKA",
              "SCAJ",

              "SLPM",
              "SLPS"

          ]

          def serial_priority(serial):

              if not serial:
                  return 999

              serial_upper = serial.upper()

              for index, prefix in enumerate(
                  region_priority
              ):

                  if serial_upper.startswith(prefix):
                      return index

              return 100

          def choose_cover_serial(variants):

              best = None

              for variant in variants:

                  serial = variant.get(
                      "serial"
                  )

                  if not serial:
                      continue

                  if best is None:

                      best = serial

                      continue

                  if (
                      serial_priority(serial)
                      <
                      serial_priority(best)
                  ):

                      best = serial

              return best

          # ============================================================
          # ESCOLHE UMA ENTRADA REPRESENTATIVA
          # ============================================================

          for group_key, variants in groups.items():

              variants.sort(
                  key=lambda game: (
                      serial_priority(
                          game.get("serial")
                      ),

                      -sum(
                          value is not None
                          and value != ""
                          for value in [
                              game.get("year"),
                              game.get("developer"),
                              game.get("publisher"),
                              game.get("genre"),
                              game.get("serial")
                          ]
                      ),

                      len(
                          game.get(
                              "title",
                              ""
                          )
                      )
                  )
              )

              representative = dict(
                  variants[0]
              )

              # ========================================================
              # RECUPERA INFORMAÇÕES QUE ESTIVEREM FALTANDO
              # EM OUTRAS VARIANTES
              # ========================================================

              if not representative.get("year"):

                  for variant in variants:

                      year = variant.get(
                          "year"
                      )

                      if year:

                          representative["year"] = year

                          break

              if not representative.get(
                  "developer"
              ):

                  value = find_first_value(
                      variants,
                      [
                          "developer",
                          "Developer"
                      ]
                  )

                  if value:
                      representative[
                          "developer"
                      ] = value

              if not representative.get(
                  "publisher"
              ):

                  value = find_first_value(
                      variants,
                      [
                          "publisher",
                          "Publisher"
                      ]
                  )

                  if value:
                      representative[
                          "publisher"
                      ] = value

              if not representative.get(
                  "genre"
              ):

                  value = find_first_value(
                      variants,
                      [
                          "genre",
                          "genres",
                          "Genre"
                      ]
                  )

                  if value:
                      representative[
                          "genre"
                      ] = value

              # ========================================================
              # SERIALS
              # ========================================================

              serials = []
              titles = []

              for variant in variants:

                  if variant.get("serial"):
                      serials.append(
                          variant["serial"]
                      )

                  if variant.get("title"):
                      titles.append(
                          variant["title"]
                      )

              representative["serials"] = sorted(
                  set(serials)
              )

              representative["titles"] = sorted(
                  set(titles)
              )

              # ========================================================
              # SERIAL DA CAPA
              # ========================================================

              cover_serial = choose_cover_serial(
                  variants
              )

              if cover_serial:

                  representative[
                      "cover_serial"
                  ] = cover_serial

              if len(
                  representative["serials"]
              ) <= 1:

                  representative.pop(
                      "serials",
                      None
                  )

              if len(
                  representative["titles"]
              ) <= 1:

                  representative.pop(
                      "titles",
                      None
                  )

              games.append(
                  representative
              )

          # ============================================================
          # ORDENAÇÃO
          # ============================================================

          games.sort(
              key=lambda game:
                  game["title"].lower()
          )

          # ============================================================
          # DIRETÓRIOS
          # ============================================================

          os.makedirs(
              "data",
              exist_ok=True
          )

          os.makedirs(
              "data/covers",
              exist_ok=True
          )

          # ============================================================
          # CAPAS LOCAIS
          # ============================================================

          for game in games:

              serial = game.get(
                  "cover_serial"
              )

              if serial:

                  game["cover"] = (
                      f"data/covers/{serial}.jpg"
                  )

              else:

                  game["cover"] = None

              game.pop(
                  "cover_serial",
                  None
              )

          # ============================================================
          # GAMES.JSON
          # ============================================================

          with open(
              "data/games.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  games,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # GAMES-REVIEW.JSON
          # ============================================================

          with open(
              "data/games-review.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  review,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # GRUPOS DE DUPLICATAS
          # ============================================================

          duplicate_groups = []

          for group_key, variants in groups.items():

              if len(variants) > 1:

                  duplicate_groups.append({

                      "normalized_title":
                          group_key,

                      "variants":
                          variants

                  })

          duplicate_groups.sort(
              key=lambda item:
                  item[
                      "normalized_title"
                  ]
          )

          with open(
              "data/games-groups-review.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  duplicate_groups,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # ESTATÍSTICAS
          # ============================================================

          games_with_year = sum(
              1
              for game in games
              if game.get("year")
          )

          games_without_year = (
              len(games)
              -
              games_with_year
          )

          print(
              "================================"
          )

          print(
              f"Entradas originais: "
              f"{len(entries)}"
          )

          print(
              f"Entradas removidas: "
              f"{len(review)}"
          )

          print(
              f"Grupos com variantes: "
              f"{len(duplicate_groups)}"
          )

          print(
              f"Jogos no catálogo: "
              f"{len(games)}"
          )

          print(
              f"Jogos com ano: "
              f"{games_with_year}"
          )

          print(
              f"Jogos sem ano: "
              f"{games_without_year}"
          )

          print(
              "================================"
          )

          # ============================================================
          # TESTE DE ALGUNS JOGOS
          # ============================================================

          tests = [

              "Resident Evil 4",
              "Final Fantasy X",
              "God of War",
              "Grand Theft Auto: San Andreas",
              "Grand Theft Auto San Andreas"

          ]

          print("")
          print("===== TESTE DE ANOS =====")

          for game in games:

              if game["title"].lower() in [
                  x.lower()
                  for x in tests
              ]:

                  print(
                      f'{game["title"]} '
                      f'-> ano: '
                      f'{game.get("year")}'
                  )

          print(
              "================================"
          )

          PY

      - name: Download game covers
        run: |
          mkdir -p data/covers

          echo "Baixando capas que ainda não existem..."

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from concurrent.futures import ThreadPoolExecutor

          with open(
              "data/games.json",
              "r",
              encoding="utf-8"
          ) as f:

              games = json.load(f)

          BASE_URL = (
              "https://raw.githubusercontent.com/"
              "xlenore/ps2-covers/main/covers/default"
          )

          downloads = []

          for game in games:

              cover = game.get(
                  "cover"
              )

              if not cover:
                  continue

              filename = os.path.basename(
                  cover
              )

              output = os.path.join(
                  "data",
                  "covers",
                  filename
              )

              if (
                  os.path.isfile(output)
                  and
                  os.path.getsize(output) > 0
              ):

                  continue

              serial = os.path.splitext(
                  filename
              )[0]

              downloads.append(
                  (
                      serial,
                      f"{BASE_URL}/{serial}.jpg",
                      output
                  )
              )

          print(
              f"Capas já existentes: "
              f"{len(games) - len(downloads)}"
          )

          print(
              f"Capas novas para baixar: "
              f"{len(downloads)}"
          )

          def download(item):

              serial, url, output = item

              result = subprocess.run(
                  [
                      "curl",
                      "-L",
                      "--fail",
                      "--silent",
                      "--show-error",
                      "--retry",
                      "2",
                      "--connect-timeout",
                      "10",
                      "--max-time",
                      "30",
                      url,
                      "-o",
                      output
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True
              )

              if (
                  result.returncode == 0
                  and
                  os.path.isfile(output)
              ):

                  if os.path.getsize(
                      output
                  ) > 0:

                      return True, serial

              if os.path.exists(output):

                  os.remove(output)

              return False, serial

          success = 0
          failed = 0

          with ThreadPoolExecutor(
              max_workers=12
          ) as executor:

              for ok, serial in executor.map(
                  download,
                  downloads
              ):

                  if ok:

                      success += 1

                  else:

                      failed += 1

                      print(
                          f"Não encontrada: "
                          f"{serial}"
                      )

          print("")

          print(
              "================================"
          )

          print(
              f"Capas baixadas: {success}"
          )

          print(
              f"Capas não encontradas: {failed}"
          )

          print(
              "================================"
          )

          PY

      - name: Verify generated catalog
        run: |
          echo "===== TESTE DE CAPAS E ANOS ====="

          python3 - <<'PY'
          import json
          import os

          with open(
              "data/games.json",
              "r",
              encoding="utf-8"
          ) as f:

              games = json.load(f)

          tests = [

              "Resident Evil 4",
              "Final Fantasy X",
              "God of War",
              "Grand Theft Auto: San Andreas",
              "Grand Theft Auto San Andreas"

          ]

          for game in games:

              if game["title"].lower() in [
                  x.lower()
                  for x in tests
              ]:

                  cover = game.get(
                      "cover"
                  )

                  exists = (

                      cover
                      and
                      os.path.isfile(cover)
                      and
                      os.path.getsize(cover) > 0

                  )

                  print(
                      f'{game["title"]} -> '
                      f'ano: {game.get("year")} -> '
                      f'{cover} -> '
                      f'{"OK" if exists else "NÃO ENCONTRADA"}'
                  )

          print("")
          print(
              "===== RESUMO DOS ANOS ====="
          )

          with_year = sum(
              1
              for game in games
              if game.get("year")
          )

          without_year = (
              len(games)
              -
              with_year
          )

          print(
              f"Jogos com ano: "
              f"{with_year}"
          )

          print(
              f"Jogos sem ano: "
              f"{without_year}"
          )

          PY

      - name: Save catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/games.json
          git add data/games-review.json
          git add data/games-groups-review.json
          git add data/covers/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no catálogo."
          else
            git commit -m "Update PS2 games catalog"
            git push
          fi
