name: Apply site fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path("js/app.js")
          index = Path("index.html")

          a = app.read_text(encoding="utf-8")
          h = index.read_text(encoding="utf-8")

          # Remove personal identification from the credits.
          a = re.sub(r'aboutCreditsText:\s*"[^"]*"', 'aboutCreditsText:\n      "Projeto independente."', a, count=1)
          a = a.replace('"Proyecto independiente."', '"Proyecto independiente."')
          a = re.sub(r'aboutCreditsText:\s*"[^"]*"', 'aboutCreditsText:\n      "Proyecto independiente."', a, count=1) if '  es: {' in a else a

          # Replace the English credit separately.
          en_pos = a.find('  en: {')
          if en_pos >= 0:
              before = a[:en_pos]
              after = a[en_pos:]
              after = re.sub(r'aboutCreditsText:\s*"[^"]*"', 'aboutCreditsText:\n      "Independent project."', after, count=1)
              a = before + after

          # Add a reliable year normalizer. GameDB-PS2 has release-date data,
          # while older generated games.json files may use different field names.
          if 'function getGameYear(' not in a:
              marker = '/* =========================================================\n   STATUS\n========================================================= */'
              fn = '''function getGameYear(game) {\n\n  if (game?.year !== undefined && game?.year !== null && String(game.year).trim()) {\n    const direct = String(game.year).match(/\\b(19\\d{2}|20\\d{2})\\b/);\n    if (direct) return direct[1];\n  }\n\n  const values = [\n    game?.releaseYear,\n    game?.release_year,\n    game?.releaseDate,\n    game?.release_date,\n    game?.released,\n    game?.release,\n    game?.date,\n    game?.dates\n  ];\n\n  for (const value of values) {\n    if (value === undefined || value === null) continue;\n    const match = String(value).match(/\\b(19\\d{2}|20\\d{2})\\b/);\n    if (match) return match[1];\n  }\n\n  return '';\n}\n\n\n'''
              if marker in a:
                  a = a.replace(marker, fn + marker, 1)

          # Ensure every loaded game gets a normalized year property.
          target = '''          genre:\n            normalizeGenre(\n              game.genre\n            )\n        })'''
          replacement = '''          genre:\n            normalizeGenre(\n              game.genre\n            ),\n\n          year:\n            getGameYear(game)\n        })'''
          if target in a:
              a = a.replace(target, replacement, 1)

          # Remove the old personal footer credit if it exists in HTML.
          h = h.replace('Projeto e desenvolvimento: Leonardo / Mateador.', 'Projeto independente.')
          h = h.replace('Proyecto y desarrollo: Leonardo / Mateador.', 'Proyecto independiente.')
          h = h.replace('Project and development: Leonardo / Mateador.', 'Independent project.')

          # Add data-source and browser-storage information to the About modal.
          if 'data-i18n="aboutSourcesTitle"' not in h:
              block = '''\n\n        <section>\n\n          <h3 data-i18n="aboutSourcesTitle">\n            Fontes dos dados\n          </h3>\n\n          <p data-i18n="aboutGameDataSource">\n            Informações dos jogos: GameDB-PS2 — niemasd/GameDB-PS2\n          </p>\n\n          <p data-i18n="aboutCoverSource">\n            Capas dos jogos: PS2 Covers — xlenore/ps2-covers\n          </p>\n\n        </section>\n\n\n        <section>\n\n          <h3 data-i18n="aboutStorageTitle">\n            Dados salvos no navegador\n          </h3>\n\n          <p data-i18n="aboutStorageText">\n            Sua lista, favoritos e demais marcações são salvos somente no armazenamento local deste navegador. Se você trocar de navegador, usar outro dispositivo ou excluir os dados do navegador, essas informações serão perdidas.\n          </p>\n\n        </section>\n'''
              h = h.replace('      <div class="about-content">', '      <div class="about-content">' + block, 1)

          app.write_text(a, encoding="utf-8")
          index.write_text(h, encoding="utf-8")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Restore game years and update credits"
          git push
