name: Update PS2 Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GameDB-PS2
        run: |
          curl -L \
            "https://github.com/niemasd/GameDB-PS2/releases/latest/download/PS2.data.json" \
            -o PS2.data.json

      - name: Generate games.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import unicodedata

          with open("PS2.data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              entries = list(data.values())
          elif isinstance(data, list):
              entries = data
          else:
              raise ValueError("Formato inesperado da base")

          remove_patterns = [
              r"\bdemo\b",
              r"\bdemo disc\b",
              r"\bpromotional\b",
              r"\bpromo\b",
              r"\bsample disc\b",
              r"\btrial\b",
              r"\butility\b",
              r"\bsystem\b",
              r"\baction replay\b",
              r"\bgameshark\b",
              r"\bdvd\b",
              r"\bbrowser\b",
              r"\binstallation disc\b"
          ]

          edition_patterns = [
              r"\bplaystation 2 the best\b",
              r"\bps2 the best\b",
              r"\bgreatest hits\b",
              r"\bplatinum\b",
              r"\bclassics\b"
          ]

          games = []
          review = []
          groups = {}

          def get_value(game, *names):
              for name in names:
                  value = game.get(name)

                  if value is not None and value != "":
                      return value

              return None

          def clean_text(value):
              if value is None:
                  return None

              if isinstance(value, list):
                  value = ", ".join(str(x) for x in value)

              value = str(value).strip()

              value = re.sub(r"\s+", " ", value)

              return value

          def normalize_title(title):
              value = title.strip()

              value = re.sub(
                  r"\s*[\(\[]\s*(disc|disk|cd|dvd)\s*[0-9ivx]+\s*[\)\]]",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              value = re.sub(
                  r"\s*[-:]\s*(disc|disk|cd|dvd)\s*[0-9ivx]+\s*$",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              for pattern in edition_patterns:
                  value = re.sub(
                      r"\s*[\(\[]?\s*" + pattern + r"\s*[\)\]]?\s*$",
                      "",
                      value,
                      flags=re.IGNORECASE
                  )

              value = unicodedata.normalize("NFKD", value)

              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )

              value = value.lower()

              value = re.sub(r"[^a-z0-9]+", " ", value)

              value = re.sub(r"\s+", " ", value).strip()

              return value

          def should_remove(title):
              normalized = title.lower()

              for pattern in remove_patterns:
                  if re.search(pattern, normalized):
                      return True

              return False

          # ============================================================
          # GÊNEROS
          # ============================================================

          genre_map = {

